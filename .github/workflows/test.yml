name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # The lockfile is not at the repository root.
          cache-dependency-path: sample/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
